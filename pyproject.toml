[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jian-ling"
version = "0.1.0"
description = "Lightweight chat session helpers."
requires-python = "3.12"
dependencies = [
  "openai",
  "ipython",
  "streamlit>=1.33",
]

# Install with `pip install -e .` so `import jian_ling` works everywhere (Streamlit Cloud, venv, etc.)
[tool.setuptools.packages.find]
where = ["."]
